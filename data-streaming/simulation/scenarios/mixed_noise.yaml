name: "mixed_noise"
description: >
  Convoy patrol plus 3 civilian random-walk vehicles with low signatures,
  elevated false-positive rates on all sensors. Tests fusion-layer separation
  of convoy pattern from background noise.
duration_seconds: 900
seed: 99
ao:
  name: "AO CHARLIE"
  center: [34.050, -118.250]
  bbox_km: 5.0
  road_waypoints:
    - [34.040, -118.250]
    - [34.060, -118.250]
sensors:
  - id: "UGS-001"
    modality: "ugs"
    detection_type: "seismic"
    location: [34.044, -118.250]
    detection_radius_m: 250
    false_positive_rate_per_min: 0.5
  - id: "UGS-002"
    modality: "ugs"
    detection_type: "seismic"
    location: [34.050, -118.250]
    detection_radius_m: 250
    false_positive_rate_per_min: 0.5
  - id: "UGS-003"
    modality: "ugs"
    detection_type: "seismic"
    location: [34.056, -118.250]
    detection_radius_m: 250
    false_positive_rate_per_min: 0.5
  - id: "RF-001"
    modality: "rf"
    location: [34.050, -118.245]
    detection_radius_m: 2000
    false_positive_rate_per_min: 1.0
entities:
  - id: "CONVOY-1"
    type: "convoy"
    pattern: "patrol"
    period_seconds: 180
    waypoints:
      - [34.040, -118.250, 0]
      - [34.060, -118.250, 120]
      - [34.040, -118.250, 180]
    rf_signature:
      bands_mhz: [45.5, 67.2]
      burst_interval_s: 30
      tx_power_dbm: 35
    seismic_signature: 7.5
    acoustic_signature: 6.0
    visual_signature: 8.0
  - id: "CIVILIAN-1"
    type: "civilian_vehicle"
    pattern: "random_walk"
    waypoints:
      - [34.048, -118.253, 0]
    seismic_signature: 1.5
    acoustic_signature: 1.0
    visual_signature: 2.0
  - id: "CIVILIAN-2"
    type: "civilian_vehicle"
    pattern: "random_walk"
    waypoints:
      - [34.052, -118.248, 0]
    seismic_signature: 1.8
    acoustic_signature: 1.2
    visual_signature: 2.5
  - id: "CIVILIAN-3"
    type: "civilian_vehicle"
    pattern: "random_walk"
    waypoints:
      - [34.055, -118.255, 0]
    seismic_signature: 1.2
    acoustic_signature: 0.8
    visual_signature: 1.5
