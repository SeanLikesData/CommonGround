services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_MAPTILER_KEY=${VITE_MAPTILER_KEY}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules

  agent:
    build: ./agent
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-anthropic:claude-haiku-4-5}
      - AGENT_INTERVAL_SEC=${AGENT_INTERVAL_SEC:-15}
      - AGENT_RECENT_WINDOW_SEC=${AGENT_RECENT_WINDOW_SEC:-900}
      - AGENT_BASELINE_WINDOW_SEC=${AGENT_BASELINE_WINDOW_SEC:-86400}
    volumes:
      - ./agent/memories.md:/app/memories.md
    depends_on:
      - neo4j
    restart: unless-stopped

  data-streaming:
    build: ./data-streaming
    environment:
      - MONGODB_URI=mongodb://mongo:27017/commonground
    depends_on:
      - mongo
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/commonground
    depends_on:
      - mongo
    restart: unless-stopped

  report-gen:
    build: ./report-gen
    environment:
      - MONGODB_URI=mongodb://mongo:27017/commonground
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - mongo
    restart: unless-stopped

  kg-update:
    build: ./kg-update
    environment:
      - MONGODB_URI=mongodb://mongo:27017/commonground
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongo
      - neo4j
    restart: unless-stopped

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.26-community
    platform: linux/amd64
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

volumes:
  mongo_data:
  neo4j_data: